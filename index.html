<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hidden Finds</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: Helvetica, Arial, sans-serif;
    color: #111; background: #fff;
    font-size: 13px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  a { color: #06c; text-decoration: none; }
  a:hover { text-decoration: underline; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { background: #fff; border: 1px solid #bbb; padding: 6px 10px; cursor: pointer; border-radius: 0; }
  button:hover { background: #f4f4f4; }
  button.primary { background: #111; color: #fff; border-color: #111; }
  button.primary:hover { background: #333; }
  button.danger { color: #b00; border-color: #ccc; }
  button.danger:hover { background: #fef0f0; }
  button.small { padding: 3px 8px; font-size: 12px; }
  button.link { background: none; border: none; padding: 0; color: #06c; cursor: pointer; }
  button.link:hover { background: none; text-decoration: underline; }
  input[type="text"], input[type="search"], input[type="number"], input[type="password"], textarea, select {
    width: 100%; border: 1px solid #bbb; padding: 6px 8px; background: #fff; border-radius: 0;
  }
  input:focus, textarea:focus, select:focus {
    outline: 1px solid #111; outline-offset: -1px; border-color: #111;
  }
  textarea { resize: vertical; min-height: 60px; font-family: inherit; }
  label { display: block; font-size: 11px; color: #666; margin-bottom: 3px;
    text-transform: uppercase; letter-spacing: 0.04em; }

  /* layout */
  #app { display: flex; height: 100vh; }
  #panel {
    width: 360px; min-width: 360px;
    border-right: 1px solid #e3e3e3;
    background: #fff;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  #map { flex: 1; background: #f4f4f4; }

  /* header & controls */
  .head { padding: 14px 16px 10px; border-bottom: 1px solid #e3e3e3; flex-shrink: 0; }
  .head h1 { font-size: 15px; font-weight: bold; }
  .head .sub { font-size: 11px; color: #888; margin-top: 2px; }
  .section { padding: 10px 16px; border-bottom: 1px solid #e3e3e3; flex-shrink: 0; }

  .base-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .base-row button { white-space: nowrap; font-size: 12px; padding: 4px 8px; }
  .base-row .coords { font-size: 11px; color: #666; font-variant-numeric: tabular-nums; flex: 1; min-width: 100%; }
  .radius-row { display: flex; gap: 10px; align-items: center; }
  .radius-row input[type="range"] { flex: 1; }
  .radius-row .km { font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; font-size: 12px; }

  /* tabs */
  .tabs { display: flex; border-bottom: 1px solid #e3e3e3; flex-shrink: 0; }
  .tab {
    flex: 1; padding: 10px; text-align: center; cursor: pointer;
    border-bottom: 2px solid transparent; font-size: 13px; user-select: none;
  }
  .tab:hover { background: #fafafa; }
  .tab.active { border-bottom-color: #111; font-weight: bold; }
  .tab .count { color: #999; font-weight: normal; }

  /* tag chips */
  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    border: 1px solid #bbb; background: #fff; padding: 4px 9px;
    cursor: pointer; font-size: 12px; user-select: none;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .chip:hover { background: #f4f4f4; }
  .chip.active { background: #111; color: #fff; border-color: #111; }
  .chip .count { color: #999; font-size: 11px; }
  .chip.active .count { color: #ccc; }

  /* list */
  .list { flex: 1; overflow-y: auto; }
  .listhead { padding: 8px 16px 6px; font-size: 11px; color: #888;
    text-transform: uppercase; letter-spacing: 0.04em; background: #fafafa;
    border-bottom: 1px solid #eee; }
  .row {
    padding: 10px 16px; border-bottom: 1px solid #eee;
    cursor: pointer; display: flex; gap: 10px; align-items: flex-start;
  }
  .row:hover { background: #fafafa; }
  .row .thumb {
    width: 48px; height: 48px; background: #f0f0f0; flex-shrink: 0;
    background-size: cover; background-position: center;
    border: 1px solid #e3e3e3;
  }
  .row .body { flex: 1; min-width: 0; }
  .row .title { font-weight: bold; font-size: 13px; }
  .row .note { color: #666; font-size: 12px; overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .row .meta { display: flex; gap: 8px; margin-top: 3px; font-size: 11px; color: #999;
    align-items: center; flex-wrap: wrap; }
  .row .pintags { display: flex; gap: 3px; flex-wrap: wrap; }
  .pintag { font-size: 10px; padding: 1px 5px; border: 1px solid #ddd; color: #666; line-height: 14px; }
  .row.no-coords .title::before { content: "○ "; color: #c80; }

  /* walk detail panel (sidebar takeover) */
  .detail {
    flex: 1; overflow-y: auto; padding: 0;
  }
  .detail .dhead {
    padding: 12px 16px; border-bottom: 1px solid #e3e3e3;
    display: flex; align-items: center; gap: 10px;
    background: #fff; position: sticky; top: 0; z-index: 5;
  }
  .detail .dhead button.back { padding: 4px 8px; }
  .detail .dhead h2 { font-size: 15px; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .detail .dsec { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; }
  .detail .dsec h3 { font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.04em; color: #666; margin-bottom: 6px; }
  .detail .desc { white-space: pre-wrap; }
  .detail .stats { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: #444; }
  .detail .stats .stat { display: flex; gap: 4px; }
  .detail .stats .lbl { color: #888; }
  .detail .park { font-size: 12px; line-height: 1.6; }
  .detail .park .what3 { color: #b22; font-weight: bold; }
  .detail .park .mono { font-variant-numeric: tabular-nums; }
  .detail .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .detail .gallery img { width: 100%; aspect-ratio: 1; object-fit: cover; cursor: zoom-in; border: 1px solid #e3e3e3; }
  .detail .poi-list { }
  .detail .poi-row { display: flex; gap: 8px; padding: 8px 0; border-top: 1px solid #f4f4f4; cursor: pointer; }
  .detail .poi-row:first-child { border-top: none; }
  .detail .poi-row:hover { background: #fafafa; }
  .detail .poi-row .pdot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
  .detail .poi-row .pbody { flex: 1; min-width: 0; }
  .detail .poi-row .pt { font-weight: bold; font-size: 13px; }
  .detail .poi-row .pn { color: #666; font-size: 12px; }
  .detail .poi-row .ptags { font-size: 10px; color: #888; }

  /* FAB */
  .fab {
    position: absolute; right: 16px; bottom: 16px;
    height: 44px; padding: 0 16px; border-radius: 22px;
    background: #111; color: #fff; border: none;
    font-size: 14px; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2); z-index: 800;
  }
  .fab:hover { background: #333; }
  .fab.placing { background: #b00; }

  #placehint {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    background: #111; color: #fff; padding: 6px 12px; font-size: 12px;
    z-index: 800; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  #placehint.hidden { display: none; }
  #placehint a { color: #fff; text-decoration: underline; margin-left: 8px; }

  /* modal */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 20px;
  }
  .modal-bg.hidden { display: none; }
  .modal {
    background: #fff; max-width: 520px; width: 100%; max-height: 90vh;
    overflow-y: auto; padding: 18px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }
  .modal h2 { font-size: 15px; margin-bottom: 12px; }
  .modal .field { margin-bottom: 10px; }
  .modal .field-row { display: flex; gap: 8px; }
  .modal .field-row .field { flex: 1; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .modal .actions .spacer { flex: 1; }
  .modal hr { border: none; border-top: 1px solid #eee; margin: 14px 0; }
  .modal .sub { font-size: 11px; color: #888; }

  /* photo grid */
  .photo-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .photo-item {
    width: 80px; height: 80px; position: relative;
    background-size: cover; background-position: center;
    border: 1px solid #ddd; cursor: zoom-in;
  }
  .photo-item .rm {
    position: absolute; top: 2px; right: 2px; width: 18px; height: 18px;
    border-radius: 50%; background: rgba(0,0,0,0.7); color: #fff;
    border: none; font-size: 12px; line-height: 18px; padding: 0; cursor: pointer;
  }
  .photo-add {
    width: 80px; height: 80px; border: 1px dashed #bbb;
    display: flex; align-items: center; justify-content: center;
    color: #888; cursor: pointer; background: #fafafa; font-size: 12px;
  }
  .photo-add:hover { background: #f0f0f0; color: #111; }
  .photo-add input { display: none; }

  /* leaflet popup tuning */
  .leaflet-popup-content { margin: 10px 12px; font-family: Helvetica, Arial, sans-serif; font-size: 13px; min-width: 180px; }
  .leaflet-popup-content h3 { font-size: 14px; margin-bottom: 4px; }
  .leaflet-popup-content .pop-actions { margin-top: 8px; display: flex; gap: 6px; }

  /* lightbox */
  #lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.9);
    display: flex; align-items: center; justify-content: center; z-index: 2000;
    cursor: zoom-out;
  }
  #lightbox.hidden { display: none; }
  #lightbox img { max-width: 95vw; max-height: 95vh; object-fit: contain; }

  /* toast */
  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #111; color: #fff; padding: 8px 14px; font-size: 13px;
    z-index: 1500; opacity: 0; transition: opacity 0.2s;
  }
  #toast.show { opacity: 1; }
  #toast.err { background: #b00; }

  /* park marker glyph */
  .park-marker { display: flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 4px;
    background: #111; color: #fff; font-weight: bold; font-size: 12px;
    border: 2px solid #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
  .park-marker.dim { opacity: 0.4; }

  /* mobile */
  @media (max-width: 720px) {
    #app { flex-direction: column; }
    #panel { width: 100%; min-width: 0; max-height: 55vh; border-right: none; border-bottom: 1px solid #e3e3e3; }
    #map { min-height: 45vh; }
  }

  .muted { color: #888; font-size: 11px; }
  .hidden { display: none !important; }
  .empty { padding: 30px 16px; text-align: center; color: #888; font-size: 13px; }
</style>
</head>
<body>
  <div id="app">
    <aside id="panel">
      <!-- LIST MODE -->
      <div id="mode-list" style="display: flex; flex-direction: column; height: 100%;">
        <div class="head">
          <h1>Hidden Finds</h1>
          <div class="sub">Somerset &amp; Wiltshire</div>
        </div>

        <div class="section">
          <label>Base</label>
          <div class="base-row">
            <button id="btn-mylocation">My location</button>
            <button id="btn-setbase-map">Pick on map</button>
            <button id="btn-clearbase" class="small">×</button>
            <div class="coords" id="base-status">not set</div>
          </div>
        </div>

        <div class="section">
          <label>Explore within: <span id="radius-val">20</span> km</label>
          <div class="radius-row">
            <input type="range" id="radius" min="1" max="100" value="20" step="1">
          </div>
        </div>

        <div class="section">
          <input type="search" id="search" placeholder="Search…">
        </div>

        <div class="tabs">
          <div class="tab active" data-tab="walks">Walks <span class="count" id="walks-count">0</span></div>
          <div class="tab" data-tab="pins">Loose pins <span class="count" id="pins-count">0</span></div>
        </div>

        <div class="section" id="tags-section">
          <div class="tags" id="tag-chips"></div>
        </div>

        <div class="list" id="list"></div>
      </div>

      <!-- WALK DETAIL MODE -->
      <div id="mode-detail" class="detail hidden"></div>
    </aside>

    <div id="map"></div>
  </div>

  <button id="fab" class="fab" title="New">+ New walk</button>
  <div id="placehint" class="hidden">Click on map · <a href="#" id="cancel-place">cancel</a></div>

  <!-- Walk edit modal -->
  <div id="modal-walk" class="modal-bg hidden">
    <div class="modal">
      <h2 id="walk-edit-title">New walk</h2>
      <div class="field">
        <label>Name</label>
        <input type="text" id="w-name" maxlength="200">
      </div>
      <div class="field">
        <label>Description (what to expect)</label>
        <textarea id="w-description" maxlength="6000" rows="4"></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Difficulty</label>
          <select id="w-difficulty">
            <option value="">—</option>
            <option value="easy">Easy</option>
            <option value="moderate">Moderate</option>
            <option value="hard">Hard</option>
            <option value="strenuous">Strenuous</option>
          </select>
        </div>
        <div class="field">
          <label>Distance (km)</label>
          <input type="number" id="w-distance" step="0.1" min="0" max="200">
        </div>
        <div class="field">
          <label>Duration (min)</label>
          <input type="number" id="w-duration" step="5" min="0" max="1440">
        </div>
      </div>
      <div class="field">
        <label>Terrain</label>
        <input type="text" id="w-terrain" maxlength="400" placeholder="e.g. rocky, some steep sections, stiles">
      </div>
      <div class="field">
        <label>Toilets</label>
        <input type="text" id="w-toilets" maxlength="400" placeholder="e.g. at car park / none / pub at start">
      </div>
      <div class="field">
        <label>Mud / wet</label>
        <input type="text" id="w-mud" maxlength="400" placeholder="e.g. boggy after rain, dry in summer">
      </div>
      <hr>
      <div class="field">
        <label>Parking</label>
        <div class="field-row">
          <div class="field">
            <label>Lat</label>
            <input type="number" id="w-plat" step="0.000001">
          </div>
          <div class="field">
            <label>Lon</label>
            <input type="number" id="w-plon" step="0.000001">
          </div>
          <div class="field" style="flex: 0; align-self: end;">
            <button id="w-park-pick" class="small">Pick on map</button>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Postcode</label>
            <input type="text" id="w-postcode" maxlength="16" placeholder="BA11 1AA">
          </div>
          <div class="field">
            <label>what3words</label>
            <input type="text" id="w-w3w" maxlength="80" placeholder="trial.lake.boats">
          </div>
        </div>
      </div>
      <hr>
      <div class="field">
        <label>Photos</label>
        <div class="photo-grid" id="w-photo-grid">
          <label class="photo-add" id="w-photo-add">
            + add
            <input type="file" accept="image/*" multiple id="w-photo-input">
          </label>
        </div>
        <div class="muted" style="margin-top:4px;">Up to 8 photos. Resized to 1600px.</div>
      </div>
      <hr>
      <div class="field">
        <label>Points of interest</label>
        <div id="w-poi-list"></div>
        <button id="w-poi-add" class="small" style="margin-top: 6px;">+ Add POI</button>
      </div>
      <div class="field">
        <label>URL (optional)</label>
        <input type="text" id="w-url" maxlength="1000">
      </div>
      <div class="actions">
        <button id="w-delete" class="danger hidden">Delete</button>
        <div class="spacer"></div>
        <button id="w-cancel">Cancel</button>
        <button id="w-save" class="primary">Save</button>
      </div>
    </div>
  </div>

  <!-- POI edit sub-modal -->
  <div id="modal-poi" class="modal-bg hidden">
    <div class="modal" style="max-width: 420px;">
      <h2 id="poi-edit-title">POI</h2>
      <div class="field">
        <label>Title</label>
        <input type="text" id="p-title" maxlength="200">
      </div>
      <div class="field">
        <label>Note</label>
        <textarea id="p-note" maxlength="2000" rows="3"></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Lat</label>
          <input type="number" id="p-lat" step="0.000001">
        </div>
        <div class="field">
          <label>Lon</label>
          <input type="number" id="p-lon" step="0.000001">
        </div>
        <div class="field" style="flex: 0; align-self: end;">
          <button id="p-pick" class="small">Pick on map</button>
        </div>
      </div>
      <div class="field">
        <label>Tags</label>
        <div class="tags" id="poi-tags"></div>
      </div>
      <div class="actions">
        <button id="p-delete" class="danger">Delete</button>
        <div class="spacer"></div>
        <button id="p-cancel">Cancel</button>
        <button id="p-save" class="primary">OK</button>
      </div>
    </div>
  </div>

  <!-- Loose pin edit modal -->
  <div id="modal-pin" class="modal-bg hidden">
    <div class="modal">
      <h2 id="pin-edit-title">Pin</h2>
      <div class="field">
        <label>Title</label>
        <input type="text" id="lp-title" maxlength="200">
      </div>
      <div class="field">
        <label>Note</label>
        <textarea id="lp-note" maxlength="4000" rows="3"></textarea>
      </div>
      <div class="field-row">
        <div class="field"><label>Lat</label><input type="number" id="lp-lat" step="0.000001"></div>
        <div class="field"><label>Lon</label><input type="number" id="lp-lon" step="0.000001"></div>
        <div class="field" style="flex:0;align-self:end;"><button id="lp-pick" class="small">Pick on map</button></div>
      </div>
      <div class="field">
        <label>Tags</label>
        <div class="tags" id="lp-tags"></div>
      </div>
      <div class="field">
        <label>URL</label>
        <input type="text" id="lp-url" maxlength="1000">
      </div>
      <div class="field">
        <label>Photos</label>
        <div class="photo-grid" id="lp-photo-grid">
          <label class="photo-add" id="lp-photo-add">+ add<input type="file" accept="image/*" multiple id="lp-photo-input"></label>
        </div>
      </div>
      <div class="actions">
        <button id="lp-delete" class="danger hidden">Delete</button>
        <div class="spacer"></div>
        <button id="lp-cancel">Cancel</button>
        <button id="lp-save" class="primary">Save</button>
      </div>
    </div>
  </div>

  <!-- Sign-in modal -->
  <div id="modal-signin" class="modal-bg hidden">
    <div class="modal" style="max-width: 320px;">
      <h2>Sign in</h2>
      <div class="field">
        <label>Password</label>
        <input type="password" id="signin-pwd" autocomplete="current-password">
      </div>
      <div class="actions">
        <button id="signin-cancel">Cancel</button>
        <button id="signin-ok" class="primary">Sign in</button>
      </div>
    </div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="hidden"><img id="lightbox-img" src="" alt=""></div>

  <div id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  (function(){
    'use strict';

    /* ── tag palette (matches user's spec: well=blue, historic=brown,
          woodland=green, waterfall=light blue) ─────────────────────── */
    const TAGS = [
      { key:'cave',         label:'Cave',          color:'#4a3826' },
      { key:'waterfall',    label:'Waterfall',     color:'#6cb4d8' },
      { key:'swimming',     label:'Swimming',      color:'#1d8a8a' },
      { key:'woodland',     label:'Woodland',      color:'#3a7a3a' },
      { key:'spring-well',  label:'Spring & Well', color:'#2a6dc0' },
      { key:'viewpoint',    label:'Viewpoint',     color:'#b88a2e' },
      { key:'historic',     label:'Historic',      color:'#6b4a2b' },
      { key:'farmshops',    label:'Farmshops',     color:'#d8762e' },
      { key:'holloway',     label:'Holloway',      color:'#6b7a5c' },
    ];
    const TAG_COLOR = Object.fromEntries(TAGS.map(t => [t.key, t.color]));
    const TAG_LABEL = Object.fromEntries(TAGS.map(t => [t.key, t.label]));
    const DEFAULT_COLOR = '#888';
    const MAX_PHOTOS = 8;
    const DIFFICULTY_LABEL = { easy:'Easy', moderate:'Moderate', hard:'Hard', strenuous:'Strenuous' };

    /* ── state ─────────────────────────────────────────────────── */
    const state = {
      walks: [],
      pins: [],
      tab: 'walks',                // 'walks' | 'pins'
      filterTags: new Set(),
      searchQ: '',
      base: null,
      radiusKm: 20,
      mode: 'list',                // 'list' | 'detail'
      detailWalkId: null,
      placing: null,               // null | {target, kind, ...} where kind is 'newpin'|'setbase'|'walkpark'|'poiloc'|'pinloc'
      walkDraft: null,
      poiDraft: null,
      poiDraftIdx: -1,             // index in walkDraft.pois, or -1 if new
      pinDraft: null,
      markers: { walks: new Map(), pois: new Map(), pins: new Map() },
    };

    const $ = (id) => document.getElementById(id);

    /* ── map setup ─────────────────────────────────────────────── */
    const map = L.map('map', { zoomControl: true }).setView([51.25, -2.46], 10);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors', maxZoom: 19,
    }).addTo(map);
    let radiusCircle = null, baseMarker = null;

    map.on('click', (e) => {
      if (!state.placing) return;
      const { lat, lng: lon } = e.latlng;
      const p = state.placing;
      state.placing = null;
      hidePlaceHint();
      $('fab').classList.remove('placing');

      if (p.kind === 'setbase') {
        setBase(lat, lon);
      } else if (p.kind === 'newpin') {
        openPinModal({ id:null, title:'', note:'', lat, lon, tags:[], url:'', photos:[] });
      } else if (p.kind === 'walkpark') {
        state.walkDraft.parking.lat = lat;
        state.walkDraft.parking.lon = lon;
        openWalkModal(state.walkDraft);
      } else if (p.kind === 'poiloc') {
        state.poiDraft.lat = lat; state.poiDraft.lon = lon;
        openPoiModal(state.poiDraft, state.poiDraftIdx);
      } else if (p.kind === 'pinloc') {
        state.pinDraft.lat = lat; state.pinDraft.lon = lon;
        openPinModal(state.pinDraft);
      }
    });

    /* ── helpers ───────────────────────────────────────────────── */
    function toast(msg, err) {
      const el = $('toast');
      el.textContent = msg;
      el.classList.toggle('err', !!err);
      el.classList.add('show');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 2400);
    }
    function showPlaceHint(text) {
      const el = $('placehint');
      el.firstChild.textContent = (text || 'Click on map') + ' · ';
      el.classList.remove('hidden');
    }
    function hidePlaceHint() { $('placehint').classList.add('hidden'); }

    function distKm(a, b) {
      const R = 6371, toRad = d => d * Math.PI / 180;
      const dLat = toRad(b.lat - a.lat), dLon = toRad(b.lon - a.lon);
      const la1 = toRad(a.lat), la2 = toRad(b.lat);
      const x = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
      return 2 * R * Math.asin(Math.sqrt(x));
    }

    function dotIcon(color, size) {
      size = size || 16;
      const r = size/2 - 1;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        <circle cx="${size/2}" cy="${size/2}" r="${r-1}" fill="${color}" stroke="#fff" stroke-width="2"/>
      </svg>`;
      return L.divIcon({ className:'hf-dot', html: svg, iconSize:[size,size], iconAnchor:[size/2,size/2], popupAnchor:[0,-size/2] });
    }

    function parkIcon(dim) {
      return L.divIcon({
        className: 'hf-park',
        html: `<div class="park-marker ${dim?'dim':''}">P</div>`,
        iconSize: [22, 22], iconAnchor: [11, 11], popupAnchor: [0, -11],
      });
    }

    function primaryTag(tags) {
      for (const t of TAGS) if (tags && tags.includes(t.key)) return t.key;
      return null;
    }
    function colorOf(tags) {
      const p = primaryTag(tags);
      return p ? TAG_COLOR[p] : DEFAULT_COLOR;
    }
    function photoUrl(name) { return '/photos/' + name; }

    function escHtml(s) {
      return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    /* ── base & radius ─────────────────────────────────────────── */
    function setBase(lat, lon) {
      state.base = { lat, lon };
      localStorage.setItem('hf_base', JSON.stringify(state.base));
      updateBaseUI();
      updateRadiusCircle();
      render();
    }
    function clearBase() {
      state.base = null;
      localStorage.removeItem('hf_base');
      updateBaseUI();
      updateRadiusCircle();
      render();
    }
    function loadBase() {
      try {
        const raw = localStorage.getItem('hf_base');
        if (raw) state.base = JSON.parse(raw);
      } catch (e) {}
      const rRaw = localStorage.getItem('hf_radius');
      if (rRaw) {
        const r = parseInt(rRaw, 10);
        if (r >= 1 && r <= 100) {
          state.radiusKm = r;
          $('radius').value = r;
          $('radius-val').textContent = r;
        }
      }
      updateBaseUI();
      updateRadiusCircle();
    }
    function updateBaseUI() {
      const el = $('base-status');
      el.textContent = state.base
        ? `${state.base.lat.toFixed(5)}, ${state.base.lon.toFixed(5)}`
        : 'not set';
    }
    function updateRadiusCircle() {
      if (radiusCircle) { map.removeLayer(radiusCircle); radiusCircle = null; }
      if (baseMarker)   { map.removeLayer(baseMarker);   baseMarker = null; }
      if (state.base) {
        radiusCircle = L.circle([state.base.lat, state.base.lon], {
          radius: state.radiusKm * 1000, color:'#111', weight:1, opacity:0.45,
          fillColor:'#111', fillOpacity:0.03, interactive: false,
        }).addTo(map);
        baseMarker = L.marker([state.base.lat, state.base.lon], {
          icon: dotIcon('#111', 12), interactive: false,
        }).addTo(map);
      }
    }

    $('btn-mylocation').addEventListener('click', () => {
      if (!navigator.geolocation) { toast('Geolocation not supported', true); return; }
      const b = $('btn-mylocation');
      b.disabled = true; b.textContent = '…';
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          setBase(pos.coords.latitude, pos.coords.longitude);
          map.setView([pos.coords.latitude, pos.coords.longitude], 12);
          b.disabled = false; b.textContent = 'My location';
        },
        (err) => { toast('Location: ' + err.message, true); b.disabled = false; b.textContent = 'My location'; },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    });
    $('btn-setbase-map').addEventListener('click', () => {
      state.placing = { kind: 'setbase' };
      showPlaceHint('Click on map to set base');
    });
    $('btn-clearbase').addEventListener('click', clearBase);

    $('radius').addEventListener('input', () => {
      state.radiusKm = parseInt($('radius').value, 10);
      $('radius-val').textContent = state.radiusKm;
      localStorage.setItem('hf_radius', state.radiusKm);
      updateRadiusCircle();
      render();
    });

    /* ── tabs ──────────────────────────────────────────────────── */
    document.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
        state.tab = t.dataset.tab;
        updateFabLabel();
        render();
      });
    });
    function updateFabLabel() {
      $('fab').textContent = state.tab === 'walks' ? '+ New walk' : '+ New pin';
    }

    /* ── tag chips ─────────────────────────────────────────────── */
    function renderTagChips(container, currentTags, onToggle, includeCounts) {
      container.innerHTML = '';
      let counts = null;
      if (includeCounts) {
        counts = {};
        const items = state.tab === 'walks'
          ? state.walks.flatMap(w => (w.pois || []).flatMap(p => p.tags || []))
          : state.pins.flatMap(p => p.tags || []);
        for (const t of items) counts[t] = (counts[t] || 0) + 1;
      }
      for (const t of TAGS) {
        const active = currentTags.has(t.key);
        const chip = document.createElement('div');
        chip.className = 'chip' + (active ? ' active' : '');
        const countHtml = (includeCounts && counts[t.key]) ? ` <span class="count">${counts[t.key]}</span>` : '';
        chip.innerHTML = `<span class="dot" style="background:${t.color}"></span>${t.label}${countHtml}`;
        chip.addEventListener('click', () => onToggle(t.key));
        container.appendChild(chip);
      }
    }

    /* ── filter logic ──────────────────────────────────────────── */
    function matchesQuery(text, q) {
      return !q || text.toLowerCase().includes(q);
    }
    function withinRadius(lat, lon) {
      if (!state.base || lat == null) return true;
      return distKm(state.base, { lat, lon }) <= state.radiusKm;
    }
    function walkMatches(w) {
      const q = state.searchQ.toLowerCase();
      const hay = [
        w.name, w.description, w.terrain, w.toilets, w.mud,
        w.parking?.postcode, w.parking?.what3words,
        (w.pois || []).map(p => p.title + ' ' + (p.tags || []).join(' ')).join(' ')
      ].filter(Boolean).join(' ');
      if (!matchesQuery(hay, q)) return false;
      if (state.filterTags.size) {
        const walkTags = new Set((w.pois || []).flatMap(p => p.tags || []));
        let any = false;
        for (const t of state.filterTags) if (walkTags.has(t)) { any = true; break; }
        if (!any) return false;
      }
      // radius: based on parking location (if set)
      if (state.base && w.parking && w.parking.lat != null) {
        if (distKm(state.base, { lat: w.parking.lat, lon: w.parking.lon }) > state.radiusKm) return false;
      }
      return true;
    }
    function pinMatches(p) {
      const q = state.searchQ.toLowerCase();
      const hay = ((p.title||'') + ' ' + (p.note||'') + ' ' + (p.tags||[]).join(' ')).toLowerCase();
      if (!matchesQuery(hay, q)) return false;
      if (state.filterTags.size) {
        if (!(p.tags || []).some(t => state.filterTags.has(t))) return false;
      }
      if (state.base && p.lat != null) {
        if (distKm(state.base, { lat: p.lat, lon: p.lon }) > state.radiusKm) return false;
      }
      return true;
    }

    /* ── markers ───────────────────────────────────────────────── */
    function clearMarkers() {
      for (const m of state.markers.walks.values()) map.removeLayer(m);
      for (const m of state.markers.pois.values()) map.removeLayer(m);
      for (const m of state.markers.pins.values()) map.removeLayer(m);
      state.markers.walks.clear();
      state.markers.pois.clear();
      state.markers.pins.clear();
    }

    function renderMarkers() {
      clearMarkers();
      if (state.mode === 'detail') {
        // Show only the open walk: parking + POIs
        const w = state.walks.find(x => x.id === state.detailWalkId);
        if (!w) return;
        if (w.parking && w.parking.lat != null) {
          const m = L.marker([w.parking.lat, w.parking.lon], { icon: parkIcon(false) });
          m.bindPopup(`<h3>${escHtml(w.name)}</h3><div class="muted">Parking</div>`);
          m.addTo(map);
          state.markers.walks.set(w.id, m);
        }
        for (const poi of (w.pois || [])) {
          if (poi.lat == null) continue;
          const m = L.marker([poi.lat, poi.lon], { icon: dotIcon(colorOf(poi.tags), 18) });
          m.bindPopup(() => poiPopupHtml(poi));
          m.addTo(map);
          state.markers.pois.set(poi.id, m);
        }
        return;
      }

      // list mode
      if (state.tab === 'walks') {
        for (const w of state.walks) {
          if (!walkMatches(w)) continue;
          if (!w.parking || w.parking.lat == null) continue;
          const m = L.marker([w.parking.lat, w.parking.lon], { icon: parkIcon(false) });
          m.bindPopup(() => walkPopupHtml(w));
          m.on('popupopen', () => bindWalkPopup(w));
          m.addTo(map);
          state.markers.walks.set(w.id, m);
        }
      } else {
        for (const p of state.pins) {
          if (!pinMatches(p)) continue;
          if (p.lat == null) continue;
          const m = L.marker([p.lat, p.lon], { icon: dotIcon(colorOf(p.tags), 16) });
          m.bindPopup(() => pinPopupHtml(p));
          m.on('popupopen', () => bindPinPopup(p));
          m.addTo(map);
          state.markers.pins.set(p.id, m);
        }
      }
    }

    function walkPopupHtml(w) {
      const photoCount = (w.photos || []).length;
      const poiCount = (w.pois || []).length;
      return `<h3>${escHtml(w.name)}</h3>
        <div class="muted">${poiCount} POI${poiCount===1?'':'s'} · ${photoCount} photo${photoCount===1?'':'s'}</div>
        <div class="pop-actions">
          <button data-action="open">Open walk</button>
        </div>`;
    }
    function bindWalkPopup(w) {
      document.querySelector('.leaflet-popup-content [data-action="open"]')?.addEventListener('click', () => {
        map.closePopup();
        openDetail(w.id);
      });
    }
    function poiPopupHtml(poi) {
      const tags = (poi.tags || []).filter(t => TAG_LABEL[t])
        .map(t => `<span class="pintag" style="border:1px solid ${TAG_COLOR[t]};color:${TAG_COLOR[t]};padding:0 4px;font-size:10px;margin-right:2px">${TAG_LABEL[t]}</span>`).join('');
      return `<h3>${escHtml(poi.title)}</h3>
        ${tags ? `<div>${tags}</div>` : ''}
        ${poi.note ? `<div style="margin-top:4px;color:#444">${escHtml(poi.note)}</div>` : ''}`;
    }
    function pinPopupHtml(p) {
      const tags = (p.tags || []).filter(t => TAG_LABEL[t])
        .map(t => `<span class="pintag" style="border:1px solid ${TAG_COLOR[t]};color:${TAG_COLOR[t]};padding:0 4px;font-size:10px;margin-right:2px">${TAG_LABEL[t]}</span>`).join('');
      const url = p.url ? `<div style="margin-top:4px"><a href="${escHtml(p.url)}" target="_blank" rel="noopener">Maps ↗</a></div>` : '';
      const photos = (p.photos || []).length
        ? `<div style="display:flex;gap:3px;margin-top:6px">${p.photos.slice(0,4).map(n => `<img src="${photoUrl(n)}" style="width:50px;height:50px;object-fit:cover;cursor:pointer" data-photo="${escHtml(n)}">`).join('')}</div>`
        : '';
      return `<h3>${escHtml(p.title || 'Untitled')}</h3>
        ${tags ? `<div>${tags}</div>` : ''}
        ${p.note ? `<div style="margin-top:4px;color:#444">${escHtml(p.note)}</div>` : ''}
        ${photos}
        ${url}
        <div class="pop-actions">
          <button data-action="edit">Edit</button>
        </div>`;
    }
    function bindPinPopup(p) {
      const el = document.querySelector('.leaflet-popup-content');
      if (!el) return;
      el.querySelectorAll('img[data-photo]').forEach(i => i.addEventListener('click', () => openLightbox(i.src)));
      el.querySelectorAll('[data-action="edit"]').forEach(b => b.addEventListener('click', () => {
        map.closePopup();
        openPinModal(p);
      }));
    }

    /* ── render top-level ──────────────────────────────────────── */
    function render() {
      $('walks-count').textContent = state.walks.length;
      $('pins-count').textContent = state.pins.length;

      // tag chips (filter)
      renderTagChips(
        $('tag-chips'),
        state.filterTags,
        (k) => {
          if (state.filterTags.has(k)) state.filterTags.delete(k);
          else state.filterTags.add(k);
          render();
        },
        true
      );

      if (state.mode === 'list') renderList();
      else renderDetail();
      renderMarkers();
    }

    function renderList() {
      const list = $('list');
      list.innerHTML = '';
      if (state.tab === 'walks') {
        const walks = state.walks.filter(walkMatches);
        if (state.base) {
          walks.sort((a, b) => {
            const ad = (a.parking && a.parking.lat != null) ? distKm(state.base, {lat:a.parking.lat,lon:a.parking.lon}) : 1e9;
            const bd = (b.parking && b.parking.lat != null) ? distKm(state.base, {lat:b.parking.lat,lon:b.parking.lon}) : 1e9;
            return ad - bd;
          });
        }
        if (!walks.length) {
          list.innerHTML = '<div class="empty">No walks yet.<br>Tap + to add one.</div>';
          return;
        }
        for (const w of walks) list.appendChild(renderWalkRow(w));
      } else {
        const pins = state.pins.filter(pinMatches);
        const located = pins.filter(p => p.lat != null);
        const unlocated = pins.filter(p => p.lat == null);
        if (state.base) {
          located.sort((a, b) => distKm(state.base, {lat:a.lat,lon:a.lon}) - distKm(state.base, {lat:b.lat,lon:b.lon}));
        } else {
          located.sort((a, b) => (a.title||'').localeCompare(b.title||''));
        }
        unlocated.sort((a, b) => (a.title||'').localeCompare(b.title||''));
        if (!pins.length) {
          list.innerHTML = '<div class="empty">No pins.</div>';
          return;
        }
        for (const p of located) list.appendChild(renderPinRow(p, false));
        if (unlocated.length) {
          const h = document.createElement('div');
          h.className = 'listhead'; h.textContent = 'To locate';
          list.appendChild(h);
          for (const p of unlocated) list.appendChild(renderPinRow(p, true));
        }
      }
    }

    function renderWalkRow(w) {
      const row = document.createElement('div');
      row.className = 'row';
      const thumb = (w.photos && w.photos[0]) ? photoUrl(w.photos[0]) : null;
      const tags = new Set((w.pois || []).flatMap(p => p.tags || []));
      const tagDots = [...tags].filter(t => TAG_COLOR[t]).slice(0, 6)
        .map(t => `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${TAG_COLOR[t]};margin-right:3px" title="${TAG_LABEL[t]}"></span>`).join('');
      const diff = w.difficulty ? `<span>${DIFFICULTY_LABEL[w.difficulty]}</span>` : '';
      const dist = w.distance_km ? `<span>${w.distance_km} km</span>` : '';
      const dur = w.duration_min ? `<span>${formatDuration(w.duration_min)}</span>` : '';
      let baseDist = '';
      if (state.base && w.parking && w.parking.lat != null) {
        const d = distKm(state.base, { lat: w.parking.lat, lon: w.parking.lon });
        baseDist = `<span>· ${d < 10 ? d.toFixed(1) : Math.round(d)} km</span>`;
      }
      row.innerHTML = `
        ${thumb ? `<div class="thumb" style="background-image:url('${thumb}')"></div>` : `<div class="thumb"></div>`}
        <div class="body">
          <div class="title">${escHtml(w.name || 'Untitled walk')}</div>
          ${w.description ? `<div class="note">${escHtml(w.description)}</div>` : ''}
          <div class="meta">${diff}${dist}${dur}${baseDist}<span>${tagDots}</span></div>
        </div>`;
      row.addEventListener('click', () => openDetail(w.id));
      return row;
    }

    function renderPinRow(p, noCoords) {
      const row = document.createElement('div');
      row.className = 'row' + (noCoords ? ' no-coords' : '');
      const thumb = (p.photos && p.photos[0]) ? photoUrl(p.photos[0]) : null;
      const tagsHtml = (p.tags || []).filter(t => TAG_LABEL[t])
        .map(t => `<span class="pintag" style="border-color:${TAG_COLOR[t]};color:${TAG_COLOR[t]}">${TAG_LABEL[t]}</span>`).join('');
      let distStr = '';
      if (state.base && p.lat != null) {
        const d = distKm(state.base, { lat: p.lat, lon: p.lon });
        distStr = `<span>${d < 10 ? d.toFixed(1) : Math.round(d)} km</span>`;
      }
      row.innerHTML = `
        ${thumb ? `<div class="thumb" style="background-image:url('${thumb}')"></div>` : `<div class="thumb"></div>`}
        <div class="body">
          <div class="title">${escHtml(p.title || 'Untitled')}</div>
          ${p.note ? `<div class="note">${escHtml(p.note)}</div>` : ''}
          <div class="meta">${distStr}<div class="pintags">${tagsHtml}</div></div>
        </div>`;
      row.addEventListener('click', () => {
        if (p.lat != null) {
          map.setView([p.lat, p.lon], Math.max(map.getZoom(), 13));
          const m = state.markers.pins.get(p.id);
          if (m) m.openPopup();
        } else {
          openPinModal(p);
        }
      });
      return row;
    }

    function formatDuration(min) {
      if (min < 60) return `${min}m`;
      const h = Math.floor(min/60), m = min % 60;
      return m ? `${h}h ${m}m` : `${h}h`;
    }

    /* ── walk detail view ──────────────────────────────────────── */
    function openDetail(walkId) {
      const w = state.walks.find(x => x.id === walkId);
      if (!w) return;
      state.mode = 'detail';
      state.detailWalkId = walkId;
      $('mode-list').classList.add('hidden');
      $('mode-detail').classList.remove('hidden');
      render();

      // Fit map to walk bounds
      const points = [];
      if (w.parking && w.parking.lat != null) points.push([w.parking.lat, w.parking.lon]);
      for (const p of (w.pois || [])) if (p.lat != null) points.push([p.lat, p.lon]);
      if (points.length === 1) {
        map.setView(points[0], 14);
      } else if (points.length > 1) {
        map.fitBounds(points, { padding: [40, 40], maxZoom: 15 });
      }
    }

    function closeDetail() {
      state.mode = 'list';
      state.detailWalkId = null;
      $('mode-detail').classList.add('hidden');
      $('mode-list').classList.remove('hidden');
      render();
    }

    function renderDetail() {
      const w = state.walks.find(x => x.id === state.detailWalkId);
      const el = $('mode-detail');
      if (!w) { closeDetail(); return; }

      const photosHtml = (w.photos || []).length
        ? `<div class="gallery">${w.photos.map(n => `<img src="${photoUrl(n)}" data-photo="${escHtml(n)}">`).join('')}</div>`
        : '<div class="muted">No photos yet.</div>';

      const stats = [
        w.difficulty ? `<div class="stat"><span class="lbl">Difficulty:</span> ${DIFFICULTY_LABEL[w.difficulty]}</div>` : '',
        w.distance_km ? `<div class="stat"><span class="lbl">Distance:</span> ${w.distance_km} km</div>` : '',
        w.duration_min ? `<div class="stat"><span class="lbl">Duration:</span> ${formatDuration(w.duration_min)}</div>` : '',
      ].filter(Boolean).join('');

      const condBits = [
        w.terrain ? `<div><span class="muted">Terrain:</span> ${escHtml(w.terrain)}</div>` : '',
        w.toilets ? `<div><span class="muted">Toilets:</span> ${escHtml(w.toilets)}</div>` : '',
        w.mud ? `<div><span class="muted">Mud:</span> ${escHtml(w.mud)}</div>` : '',
      ].filter(Boolean).join('');

      const park = w.parking || {};
      const parkLink = (park.lat != null)
        ? `<a href="https://www.google.com/maps/search/?api=1&query=${park.lat},${park.lon}" target="_blank" rel="noopener">Open in Maps ↗</a>`
        : '';
      const parkHtml = `
        ${park.postcode ? `<div><span class="muted">Postcode:</span> <span class="mono">${escHtml(park.postcode)}</span></div>` : ''}
        ${park.what3words ? `<div><span class="muted">what3words:</span> <span class="what3">///${escHtml(park.what3words)}</span></div>` : ''}
        ${park.lat != null ? `<div><span class="muted">Coords:</span> <span class="mono">${park.lat.toFixed(5)}, ${park.lon.toFixed(5)}</span> · ${parkLink}</div>` : '<div class="muted">No location set</div>'}
      `;

      const pois = w.pois || [];
      const poisHtml = pois.length
        ? `<div class="poi-list">${pois.map(p => `
            <div class="poi-row" data-poi="${escHtml(p.id)}">
              <div class="pdot" style="background:${colorOf(p.tags)}"></div>
              <div class="pbody">
                <div class="pt">${escHtml(p.title)}</div>
                ${p.note ? `<div class="pn">${escHtml(p.note)}</div>` : ''}
                <div class="ptags">${(p.tags || []).filter(t => TAG_LABEL[t]).map(t => TAG_LABEL[t]).join(' · ')}</div>
              </div>
            </div>`).join('')}</div>`
        : '<div class="muted">No POIs yet.</div>';

      el.innerHTML = `
        <div class="dhead">
          <button class="back" id="d-back">← Back</button>
          <h2>${escHtml(w.name)}</h2>
          <button class="small" id="d-edit">Edit</button>
        </div>
        ${w.description ? `<div class="dsec"><div class="desc">${escHtml(w.description)}</div></div>` : ''}
        ${stats ? `<div class="dsec"><div class="stats">${stats}</div></div>` : ''}
        ${condBits ? `<div class="dsec">${condBits}</div>` : ''}
        <div class="dsec">
          <h3>Parking</h3>
          <div class="park">${parkHtml}</div>
        </div>
        <div class="dsec">
          <h3>Photos (${(w.photos || []).length})</h3>
          ${photosHtml}
        </div>
        <div class="dsec">
          <h3>Points of interest (${pois.length})</h3>
          ${poisHtml}
        </div>
      `;
      $('d-back').addEventListener('click', closeDetail);
      $('d-edit').addEventListener('click', () => openWalkModal(w));
      el.querySelectorAll('img[data-photo]').forEach(i => i.addEventListener('click', () => openLightbox(i.src)));
      el.querySelectorAll('[data-poi]').forEach(r => r.addEventListener('click', () => {
        const poi = pois.find(x => x.id === r.dataset.poi);
        if (poi && poi.lat != null) {
          map.setView([poi.lat, poi.lon], 15);
          const m = state.markers.pois.get(poi.id);
          if (m) m.openPopup();
        }
      }));
    }

    /* ── walk edit modal ───────────────────────────────────────── */
    function openWalkModal(walk) {
      state.walkDraft = JSON.parse(JSON.stringify(walk || {
        id: null, name: '', description: '', difficulty: '',
        distance_km: null, duration_min: null,
        terrain: '', toilets: '', mud: '',
        parking: { lat: null, lon: null, postcode: '', what3words: '' },
        pois: [], photos: [], url: '',
      }));
      state.walkDraft._newPhotos = state.walkDraft._newPhotos || [];

      const w = state.walkDraft;
      $('walk-edit-title').textContent = w.id ? 'Edit walk' : 'New walk';
      $('w-name').value = w.name || '';
      $('w-description').value = w.description || '';
      $('w-difficulty').value = w.difficulty || '';
      $('w-distance').value = w.distance_km ?? '';
      $('w-duration').value = w.duration_min ?? '';
      $('w-terrain').value = w.terrain || '';
      $('w-toilets').value = w.toilets || '';
      $('w-mud').value = w.mud || '';
      $('w-plat').value = w.parking?.lat ?? '';
      $('w-plon').value = w.parking?.lon ?? '';
      $('w-postcode').value = w.parking?.postcode || '';
      $('w-w3w').value = w.parking?.what3words || '';
      $('w-url').value = w.url || '';
      $('w-delete').classList.toggle('hidden', !w.id);
      renderWalkPhotos();
      renderPoiList();
      $('modal-walk').classList.remove('hidden');
      setTimeout(() => $('w-name').focus(), 50);
    }
    function closeWalkModal() {
      state.walkDraft = null;
      $('modal-walk').classList.add('hidden');
    }
    $('w-cancel').addEventListener('click', closeWalkModal);

    $('w-park-pick').addEventListener('click', () => {
      // capture current form values into draft, then close modal & wait for click
      stashWalkForm();
      $('modal-walk').classList.add('hidden');
      state.placing = { kind: 'walkpark' };
      showPlaceHint('Click on map to set parking');
    });

    function stashWalkForm() {
      const w = state.walkDraft;
      w.name = $('w-name').value;
      w.description = $('w-description').value;
      w.difficulty = $('w-difficulty').value;
      w.distance_km = $('w-distance').value === '' ? null : parseFloat($('w-distance').value);
      w.duration_min = $('w-duration').value === '' ? null : parseInt($('w-duration').value, 10);
      w.terrain = $('w-terrain').value;
      w.toilets = $('w-toilets').value;
      w.mud = $('w-mud').value;
      w.parking = w.parking || {};
      w.parking.lat = $('w-plat').value === '' ? null : parseFloat($('w-plat').value);
      w.parking.lon = $('w-plon').value === '' ? null : parseFloat($('w-plon').value);
      w.parking.postcode = $('w-postcode').value;
      w.parking.what3words = $('w-w3w').value;
      w.url = $('w-url').value;
    }

    function renderWalkPhotos() {
      const grid = $('w-photo-grid');
      [...grid.querySelectorAll('.photo-item')].forEach(n => n.remove());
      const existing = state.walkDraft.photos || [];
      const news = state.walkDraft._newPhotos || [];
      const all = [
        ...existing.map((n, i) => ({ kind: 'existing', idx: i, src: photoUrl(n) })),
        ...news.map((p, i) => ({ kind: 'new', idx: i, src: p.dataUrl })),
      ];
      const addBtn = $('w-photo-add');
      for (const item of all) {
        const div = document.createElement('div');
        div.className = 'photo-item';
        div.style.backgroundImage = `url('${item.src}')`;
        div.addEventListener('click', (e) => { if (!e.target.classList.contains('rm')) openLightbox(item.src); });
        const rm = document.createElement('button');
        rm.className = 'rm'; rm.type = 'button'; rm.textContent = '×';
        rm.addEventListener('click', (e) => {
          e.stopPropagation();
          if (item.kind === 'existing') state.walkDraft.photos.splice(item.idx, 1);
          else state.walkDraft._newPhotos.splice(item.idx, 1);
          renderWalkPhotos();
        });
        div.appendChild(rm);
        grid.insertBefore(div, addBtn);
      }
      const total = (state.walkDraft.photos.length + state.walkDraft._newPhotos.length);
      addBtn.style.display = total >= MAX_PHOTOS ? 'none' : '';
    }

    $('w-photo-input').addEventListener('change', async (e) => {
      const files = [...e.target.files];
      e.target.value = '';
      const room = MAX_PHOTOS - (state.walkDraft.photos.length + state.walkDraft._newPhotos.length);
      for (const f of files.slice(0, room)) {
        try {
          state.walkDraft._newPhotos.push(await processPhoto(f));
          renderWalkPhotos();
        } catch (err) { toast('Photo failed: ' + err.message, true); }
      }
    });

    function renderPoiList() {
      const el = $('w-poi-list');
      const pois = state.walkDraft.pois || [];
      el.innerHTML = pois.length
        ? pois.map((p, i) => `
            <div style="display:flex;align-items:center;gap:8px;padding:4px 0;border-top:1px solid #f4f4f4;cursor:pointer" data-idx="${i}">
              <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${colorOf(p.tags)}"></span>
              <span style="flex:1">${escHtml(p.title)}</span>
              <span class="muted">${p.lat == null ? '(no loc)' : ''}</span>
            </div>`).join('')
        : '<div class="muted" style="padding:4px 0">No POIs yet</div>';
      el.querySelectorAll('[data-idx]').forEach(row => {
        row.addEventListener('click', () => {
          const idx = parseInt(row.dataset.idx, 10);
          openPoiModal(state.walkDraft.pois[idx], idx);
        });
      });
    }
    $('w-poi-add').addEventListener('click', () => {
      stashWalkForm();
      openPoiModal({ id: null, title: '', note: '', lat: null, lon: null, tags: [] }, -1);
    });

    $('w-save').addEventListener('click', async () => {
      stashWalkForm();
      const w = state.walkDraft;
      if (!w.name.trim()) { toast('Name required', true); return; }
      const newPhotos = (w._newPhotos || []).map(p => ({ name: p.name, data: p.base64 }));
      const photos = [...(w.photos || []), ...(w._newPhotos || []).map(p => p.name)];
      const payload = {
        walk: {
          id: w.id, name: w.name, description: w.description, difficulty: w.difficulty,
          distance_km: w.distance_km, duration_min: w.duration_min,
          terrain: w.terrain, toilets: w.toilets, mud: w.mud,
          parking: w.parking, pois: w.pois, photos, url: w.url,
        },
        newPhotos,
      };
      await callApi(payload, 'walk');
    });

    $('w-delete').addEventListener('click', async () => {
      if (!state.walkDraft?.id) return;
      if (!confirm('Delete this walk?')) return;
      await callApi({ deleteWalkId: state.walkDraft.id }, 'walk');
    });

    /* ── POI sub-modal ────────────────────────────────────────── */
    function openPoiModal(poi, idx) {
      state.poiDraft = JSON.parse(JSON.stringify(poi));
      state.poiDraftIdx = idx;
      $('poi-edit-title').textContent = idx >= 0 ? 'Edit POI' : 'New POI';
      $('p-title').value = state.poiDraft.title || '';
      $('p-note').value = state.poiDraft.note || '';
      $('p-lat').value = state.poiDraft.lat ?? '';
      $('p-lon').value = state.poiDraft.lon ?? '';
      $('p-delete').classList.toggle('hidden', idx < 0);
      renderPoiTags();
      // hide walk modal while POI is open
      $('modal-walk').classList.add('hidden');
      $('modal-poi').classList.remove('hidden');
      setTimeout(() => $('p-title').focus(), 50);
    }
    function renderPoiTags() {
      const tagSet = new Set(state.poiDraft.tags || []);
      renderTagChips($('poi-tags'), tagSet, (k) => {
        if (tagSet.has(k)) tagSet.delete(k); else tagSet.add(k);
        state.poiDraft.tags = [...tagSet];
        renderPoiTags();
      }, false);
    }
    $('p-cancel').addEventListener('click', () => {
      state.poiDraft = null;
      $('modal-poi').classList.add('hidden');
      openWalkModal(state.walkDraft);
    });
    $('p-pick').addEventListener('click', () => {
      // stash current POI form, close modal, wait for click
      state.poiDraft.title = $('p-title').value;
      state.poiDraft.note = $('p-note').value;
      $('modal-poi').classList.add('hidden');
      state.placing = { kind: 'poiloc' };
      showPlaceHint('Click on map to set POI location');
    });
    $('p-save').addEventListener('click', () => {
      const p = state.poiDraft;
      p.title = $('p-title').value.trim();
      p.note = $('p-note').value.trim();
      p.lat = $('p-lat').value === '' ? null : parseFloat($('p-lat').value);
      p.lon = $('p-lon').value === '' ? null : parseFloat($('p-lon').value);
      if (!p.title) { toast('POI title required', true); return; }
      if (state.poiDraftIdx >= 0) {
        state.walkDraft.pois[state.poiDraftIdx] = p;
      } else {
        if (!p.id) p.id = 'poi_' + Math.random().toString(36).slice(2, 10);
        state.walkDraft.pois.push(p);
      }
      state.poiDraft = null;
      $('modal-poi').classList.add('hidden');
      openWalkModal(state.walkDraft);
    });
    $('p-delete').addEventListener('click', () => {
      if (state.poiDraftIdx < 0) return;
      if (!confirm('Remove this POI?')) return;
      state.walkDraft.pois.splice(state.poiDraftIdx, 1);
      state.poiDraft = null;
      $('modal-poi').classList.add('hidden');
      openWalkModal(state.walkDraft);
    });

    /* ── loose pin modal ──────────────────────────────────────── */
    function openPinModal(pin) {
      state.pinDraft = JSON.parse(JSON.stringify(pin));
      state.pinDraft.tags = state.pinDraft.tags || [];
      state.pinDraft.photos = state.pinDraft.photos || [];
      state.pinDraft._newPhotos = state.pinDraft._newPhotos || [];
      $('pin-edit-title').textContent = pin.id ? 'Edit pin' : 'New pin';
      $('lp-title').value = pin.title || '';
      $('lp-note').value = pin.note || '';
      $('lp-lat').value = pin.lat ?? '';
      $('lp-lon').value = pin.lon ?? '';
      $('lp-url').value = pin.url || '';
      $('lp-delete').classList.toggle('hidden', !pin.id);
      renderPinTags();
      renderPinPhotos();
      $('modal-pin').classList.remove('hidden');
      setTimeout(() => $('lp-title').focus(), 50);
    }
    function renderPinTags() {
      const tagSet = new Set(state.pinDraft.tags || []);
      renderTagChips($('lp-tags'), tagSet, (k) => {
        if (tagSet.has(k)) tagSet.delete(k); else tagSet.add(k);
        state.pinDraft.tags = [...tagSet];
        renderPinTags();
      }, false);
    }
    function renderPinPhotos() {
      const grid = $('lp-photo-grid');
      [...grid.querySelectorAll('.photo-item')].forEach(n => n.remove());
      const existing = state.pinDraft.photos || [];
      const news = state.pinDraft._newPhotos || [];
      const all = [
        ...existing.map((n, i) => ({ kind: 'existing', idx: i, src: photoUrl(n) })),
        ...news.map((p, i) => ({ kind: 'new', idx: i, src: p.dataUrl })),
      ];
      const addBtn = $('lp-photo-add');
      for (const item of all) {
        const div = document.createElement('div');
        div.className = 'photo-item';
        div.style.backgroundImage = `url('${item.src}')`;
        div.addEventListener('click', (e) => { if (!e.target.classList.contains('rm')) openLightbox(item.src); });
        const rm = document.createElement('button');
        rm.className = 'rm'; rm.type = 'button'; rm.textContent = '×';
        rm.addEventListener('click', (e) => {
          e.stopPropagation();
          if (item.kind === 'existing') state.pinDraft.photos.splice(item.idx, 1);
          else state.pinDraft._newPhotos.splice(item.idx, 1);
          renderPinPhotos();
        });
        div.appendChild(rm);
        grid.insertBefore(div, addBtn);
      }
      const total = (state.pinDraft.photos.length + state.pinDraft._newPhotos.length);
      addBtn.style.display = total >= MAX_PHOTOS ? 'none' : '';
    }
    $('lp-photo-input').addEventListener('change', async (e) => {
      const files = [...e.target.files];
      e.target.value = '';
      const room = MAX_PHOTOS - (state.pinDraft.photos.length + state.pinDraft._newPhotos.length);
      for (const f of files.slice(0, room)) {
        try {
          state.pinDraft._newPhotos.push(await processPhoto(f));
          renderPinPhotos();
        } catch (err) { toast('Photo failed: ' + err.message, true); }
      }
    });
    $('lp-cancel').addEventListener('click', () => {
      state.pinDraft = null;
      $('modal-pin').classList.add('hidden');
    });
    $('lp-pick').addEventListener('click', () => {
      const p = state.pinDraft;
      p.title = $('lp-title').value;
      p.note = $('lp-note').value;
      p.url = $('lp-url').value;
      $('modal-pin').classList.add('hidden');
      state.placing = { kind: 'pinloc' };
      showPlaceHint('Click on map to set pin location');
    });
    $('lp-save').addEventListener('click', async () => {
      const p = state.pinDraft;
      const title = $('lp-title').value.trim();
      if (!title) { toast('Title required', true); return; }
      const lat = $('lp-lat').value === '' ? null : parseFloat($('lp-lat').value);
      const lon = $('lp-lon').value === '' ? null : parseFloat($('lp-lon').value);
      const payload = {
        pin: {
          id: p.id || null, title,
          note: $('lp-note').value.trim(),
          lat: (lat != null && !isNaN(lat)) ? lat : null,
          lon: (lon != null && !isNaN(lon)) ? lon : null,
          tags: (p.tags || []).filter(t => TAG_LABEL[t]),
          url: $('lp-url').value.trim(),
          photos: [...(p.photos || []), ...(p._newPhotos || []).map(x => x.name)],
        },
        newPhotos: (p._newPhotos || []).map(x => ({ name: x.name, data: x.base64 })),
      };
      await callApi(payload, 'pin');
    });
    $('lp-delete').addEventListener('click', async () => {
      if (!state.pinDraft?.id) return;
      if (!confirm('Delete this pin?')) return;
      await callApi({ deletePinId: state.pinDraft.id }, 'pin');
    });

    /* ── photo processing ─────────────────────────────────────── */
    async function processPhoto(file) {
      if (!file.type.startsWith('image/')) throw new Error('not an image');
      const img = await new Promise((res, rej) => {
        const i = new Image();
        i.onload = () => res(i);
        i.onerror = () => rej(new Error('decode failed'));
        i.src = URL.createObjectURL(file);
      });
      const MAX = 1600;
      let w = img.naturalWidth, h = img.naturalHeight;
      if (Math.max(w, h) > MAX) {
        const r = MAX / Math.max(w, h);
        w = Math.round(w * r); h = Math.round(h * r);
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.82));
      const dataUrl = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = () => rej(new Error('read failed'));
        r.readAsDataURL(blob);
      });
      const base64 = dataUrl.split(',')[1];
      const rand = Math.random().toString(36).slice(2, 8);
      const name = `photo_${Date.now()}_${rand}.jpg`;
      URL.revokeObjectURL(img.src);
      return { name, dataUrl, base64 };
    }

    /* ── API ──────────────────────────────────────────────────── */
    async function callApi(payload, kind) {
      const pwd = localStorage.getItem('hf_pwd');
      if (!pwd) { openSignin({ payload, kind }); return; }
      const saveBtn = kind === 'walk' ? $('w-save') : $('lp-save');
      if (saveBtn) saveBtn.disabled = true;
      try {
        const resp = await fetch('/api/save-pin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...payload, password: pwd }),
        });
        if (resp.status === 401) {
          localStorage.removeItem('hf_pwd');
          openSignin({ payload, kind });
          return;
        }
        const json = await resp.json();
        if (!resp.ok || !json.ok) {
          toast('Save failed: ' + (json.error || resp.status), true);
          return;
        }
        if (json.store) {
          state.walks = json.store.walks || [];
          state.pins = json.store.pins || [];
        }
        if (kind === 'walk') {
          closeWalkModal();
          if (state.mode === 'detail') {
            // refresh detail view; if walk was deleted, exit detail
            if (!state.walks.find(w => w.id === state.detailWalkId)) closeDetail();
          }
        } else {
          $('modal-pin').classList.add('hidden');
          state.pinDraft = null;
        }
        render();
        toast('Saved');
      } catch (err) {
        toast('Network error: ' + err.message, true);
      } finally {
        if (saveBtn) saveBtn.disabled = false;
      }
    }

    /* ── sign in ──────────────────────────────────────────────── */
    let signinPending = null;
    function openSignin(pending) {
      signinPending = pending;
      $('signin-pwd').value = '';
      $('modal-signin').classList.remove('hidden');
      setTimeout(() => $('signin-pwd').focus(), 50);
    }
    $('signin-cancel').addEventListener('click', () => {
      signinPending = null;
      $('modal-signin').classList.add('hidden');
    });
    $('signin-ok').addEventListener('click', async () => {
      const pwd = $('signin-pwd').value;
      if (!pwd) return;
      // probe first
      try {
        const r = await fetch('/api/save-pin', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ password: pwd, probe: true })
        });
        if (!r.ok) { toast('Bad password', true); return; }
      } catch (e) { toast('Network error', true); return; }
      localStorage.setItem('hf_pwd', pwd);
      $('modal-signin').classList.add('hidden');
      const pend = signinPending;
      signinPending = null;
      if (pend) await callApi(pend.payload, pend.kind);
    });
    $('signin-pwd').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('signin-ok').click(); });

    /* ── FAB ──────────────────────────────────────────────────── */
    $('fab').addEventListener('click', () => {
      if (state.placing) {
        state.placing = null; hidePlaceHint();
        $('fab').classList.remove('placing');
        return;
      }
      if (state.tab === 'walks') {
        openWalkModal(null);
      } else {
        state.placing = { kind: 'newpin' };
        $('fab').classList.add('placing');
        showPlaceHint('Click on map to place new pin');
      }
    });
    $('cancel-place').addEventListener('click', (e) => {
      e.preventDefault();
      state.placing = null; hidePlaceHint();
      $('fab').classList.remove('placing');
    });

    /* ── search ───────────────────────────────────────────────── */
    $('search').addEventListener('input', (e) => {
      state.searchQ = e.target.value.trim();
      render();
    });

    /* ── lightbox ─────────────────────────────────────────────── */
    function openLightbox(src) {
      $('lightbox-img').src = src;
      $('lightbox').classList.remove('hidden');
    }
    $('lightbox').addEventListener('click', () => $('lightbox').classList.add('hidden'));

    /* ── load store ───────────────────────────────────────────── */
    async function loadStore() {
      try {
        const resp = await fetch('/data/pins.json?_=' + Date.now());
        const j = await resp.json();
        if (Array.isArray(j)) { state.walks = []; state.pins = j; }
        else {
          state.walks = j.walks || [];
          state.pins = j.pins || [];
        }
      } catch (e) {
        toast('Could not load data', true);
      }
      render();
    }

    /* ── init ─────────────────────────────────────────────────── */
    loadBase();
    updateFabLabel();
    loadStore();

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (!$('lightbox').classList.contains('hidden')) { $('lightbox').classList.add('hidden'); return; }
      if (!$('modal-signin').classList.contains('hidden')) { $('signin-cancel').click(); return; }
      if (!$('modal-poi').classList.contains('hidden')) { $('p-cancel').click(); return; }
      if (!$('modal-walk').classList.contains('hidden')) { closeWalkModal(); return; }
      if (!$('modal-pin').classList.contains('hidden')) { $('lp-cancel').click(); return; }
      if (state.placing) {
        state.placing = null; hidePlaceHint();
        $('fab').classList.remove('placing');
        return;
      }
      if (state.mode === 'detail') closeDetail();
    });

  })();
  </script>
